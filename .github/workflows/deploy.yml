name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Đang deploy dở mà có commit mới thì để lần chạy trước xong đã, tránh hai
# lần cùng ghi đè lên nhau.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build
        env:
          # Địa chỉ Apps Script và token nằm trong Settings -> Secrets and
          # variables -> Actions của repo. Xem mục "Bảo mật" trong README:
          # cả hai giá trị này đều đọc được từ gói JavaScript đã build.
          VITE_SHEETS_ENDPOINT: ${{ secrets.VITE_SHEETS_ENDPOINT }}
          VITE_SHEETS_TOKEN: ${{ secrets.VITE_SHEETS_TOKEN }}

      # Cách triển khai này không chạy Jekyll, nhưng thêm file cho chắc để
      # nếu sau có ai chuyển sang deploy thẳng từ nhánh thì cũng không bị
      # Jekyll bỏ qua mất thư mục nào.
      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
