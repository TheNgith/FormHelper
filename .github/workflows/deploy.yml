name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Đang deploy dở mà có commit mới thì để lần chạy trước xong đã, tránh hai
# lần cùng ghi đè lên nhau.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Firestore emulator chạy trên JVM. Không có bước này thì bài kiểm tra
      # firestore.rules — tức là bài kiểm tra ranh giới bảo mật — lặng lẽ
      # không chạy được.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - run: npm test

      - run: npm run build
        env:
          # Đây là *variables* chứ không phải *secrets*, và đó là cố ý: cấu
          # hình web của Firebase nằm sẵn trong gói JavaScript gửi xuống trình
          # duyệt. Nó là định danh dự án, không phải khóa. Khóa site của
          # reCAPTCHA cũng vậy — nó phải nằm trong trang thì reCAPTCHA mới
          # chạy được. Xem mục "Bảo mật" trong README.
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          # Chỉ trang quản trị dùng tới, nhưng vẫn phải có mặt lúc build: đây
          # là biến của Vite, thay thẳng vào mã nguồn chứ không đọc lúc chạy.
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}

      # Trang quản trị kéo theo Firebase Auth và Recharts. Cả hai điểm vào dùng
      # chung src/lib/firebase.ts, nên một lệnh import đặt nhầm chỗ là chúng đi
      # thẳng vào gói của sinh viên — và kiểu hỏng đó hoàn toàn im lặng: trang
      # vẫn chạy, bài kiểm tra vẫn xanh, chỉ có bản build nặng thêm vài trăm KB.
      # Phải đo trên sản phẩm đã dựng, nên bước này đứng sau `npm run build`.
      - run: npm run check:bundle

      # Bí mật thật sự duy nhất của dự án, và nó không bao giờ tới trình duyệt.
      #
      # Triển khai cả hosting lẫn firestore rules trong cùng một bước: rules là
      # ranh giới bảo mật của ứng dụng, để nó lệch phiên bản với mã nguồn đang
      # chạy là mở ra đúng loại lỗ hổng mà bộ rules này sinh ra để bịt.
      - name: Deploy hosting và Security Rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          credentials="$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$credentials"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials"
          GOOGLE_APPLICATION_CREDENTIALS="$credentials" \
            npx firebase deploy \
              --only hosting,firestore \
              --project "$FIREBASE_PROJECT_ID" \
              --non-interactive
