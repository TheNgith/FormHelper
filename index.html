      Hai phông của giao diện: Cormorant Garamond cho tiêu đề, Lora cho phần

      Đây **không phải** phông của file PDF. File PDF dùng Libertinus nhúng
      thẳng vào tệp (public/fonts/), không liên quan gì tới hai phông ở đây —
      mạng có chặn Google Fonts thì trang chỉ đổi dáng chữ, đơn in ra vẫn y
      nguyên.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Lora:wght@400;600&display=swap"
